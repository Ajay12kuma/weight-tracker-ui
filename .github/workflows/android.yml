name: Build Android APK
on:
  push:
    branches:
      - main
jobs:
  build:
    name: Compile Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install UI Dependencies
        run: npm install

      - name: Build Angular Web App
        run: npm run build

      - name: Add Android Container
        run: npx cap add android

      - name: Sync Web App to Android Container
        run: npx cap sync android

      - name: Make Gradle Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Compile Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload Final APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: weight-tracker-android-app.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
