<div class="weight-container">
  <div class="card form-card">
    <h3>⚖️ Update Daily Weight</h3>
    
    <div class="form-group">
      <label>Date:</label>
      <input type="date" [(ngModel)]="date" (change)="loadWeight()" class="input-field">
    </div>

    <div class="form-group">
      <label>Weight (Accurate format up to grams):</label>
      <input type="number" [(ngModel)]="weightValue" placeholder="e.g. 90.700" class="input-field" step="0.001">
    </div>

    <button class="btn save-btn" (click)="saveWeight()">Save Exact Weight</button>
    <p *ngIf="message" class="flash-message">{{ message }}</p>
  </div>

  <div class="card chart-card">
    <h3>📉 30 Day Weight Trend</h3>
    <div class="canvas-wrapper">
      <canvas #weightChart></canvas>
    </div>
  </div>
</div>
